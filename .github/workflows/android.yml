name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        cache-disabled: true

    - name: Ensure Environment Files
      run: |
        if [ ! -f .env ]; then
          touch .env
        fi
        if [ ! -f app/google-services.json ]; then
          mkdir -p app
          cat << 'EOF' > app/google-services.json
        {
          "project_info": {
            "project_number": "123456789012",
            "project_id": "dummy-project",
            "storage_bucket": "dummy-project.appspot.com"
          },
          "client": [
            {
              "client_info": {
                "mobilesdk_app_id": "1:123456789012:android:dummy12345",
                "android_client_info": {
                  "package_name": "com.aistudio.securitycam.xyz123"
                }
              },
              "oauth_client": [],
              "api_key": [
                {
                  "current_key": "dummy_api_key"
                }
              ],
              "services": {
                "appinvite_service": {
                  "other_platform_oauth_client": []
                }
              }
            }
          ],
          "configuration_version": "1"
        }
        EOF
        fi

    - name: Ensure Debug Keystore
      run: |
        if [ -f debug.keystore ]; then
          echo "debug.keystore found."
        elif [ -f debug.keystore.base64 ]; then
          echo "Decoding debug.keystore.base64..."
          base64 -d debug.keystore.base64 > debug.keystore
        elif [ -n "${{ secrets.DEBUG_KEYSTORE_BASE64 }}" ]; then
          echo "Decoding from secrets..."
          echo "${{ secrets.DEBUG_KEYSTORE_BASE64 }}" | base64 -d > debug.keystore
        else
          echo "Generating debug keystore..."
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
        fi

    - name: Build with Gradle
      run: ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk
